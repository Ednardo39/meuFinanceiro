<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova saída - Meu Financeiro</title>

    <link rel="stylesheet" href="css/nova-saida.css">

</head>


<body>


    <!-- =====================================================
         MENU LATERAL
         ===================================================== -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                R$
            </div>

            <div class="logo-text">
                <strong>Meu</strong>
                <span>Financeiro</span>
            </div>

        </div>


        <!-- MENU PRINCIPAL -->

        <nav class="menu">


            <a href="index.html" class="menu-item">

                <span class="menu-icon">
                    ⌂
                </span>

                <span>
                    Dashboard
                </span>

            </a>


            <a href="nova-entrada.html" class="menu-item">

                <span class="menu-icon entrada">
                    ↑
                </span>

                <span>
                    Entradas
                </span>

            </a>


            <a href="nova-saida.html" class="menu-item active">

                <span class="menu-icon saida">
                    ↓
                </span>

                <span>
                    Gastos
                </span>

            </a>


            <a href="#" class="menu-item">

                <span class="menu-icon dividendo">
                    ◆
                </span>

                <span>
                    Dividendos
                </span>

            </a>


            <a href="#" class="menu-item">

                <span class="menu-icon">
                    ☷
                </span>

                <span>
                    Categorias
                </span>

            </a>


            <a href="#" class="menu-item">

                <span class="menu-icon">
                    ▥
                </span>

                <span>
                    Relatórios
                </span>

            </a>


            <a href="contas-cartoes.html" class="menu-item">

                <span class="menu-icon">
                    💳
                </span>

                <span>
                    Contas e cartões
                </span>

            </a>

        </nav>


        <!-- MENU INFERIOR -->

        <div class="menu-bottom">

            <a href="#" class="menu-item">

                <span class="menu-icon">
                    ⚙
                </span>

                <span>
                    Configurações
                </span>

            </a>

        </div>


    </aside>



    <!-- =====================================================
         ÁREA PRINCIPAL
         ===================================================== -->

    <main class="main-content">


        <!-- =================================================
             CABEÇALHO
             ================================================= -->

        <header class="topbar">


            <button class="mobile-menu-button">
                ☰
            </button>


            <div class="page-title">

                <h1>
                    Nova saída
                </h1>

                <p>
                    Registrar um novo gasto
                </p>

            </div>


            <!-- USUÁRIO -->

            <div class="user-area">

                <div class="user-info">

                    <strong>
                        Ednardo
                    </strong>

                    <span>
                        Minha conta
                    </span>

                </div>


                <div class="user-avatar">
                    E
                </div>

            </div>


        </header>



        <!-- =================================================
             CONTEÚDO
             ================================================= -->

        <section class="content">


            <!-- CABEÇALHO DA PÁGINA -->

            <div class="page-heading">

                <div>

                    <a
                        href="index.html"
                        class="back-link"
                    >
                        ← Voltar para o Dashboard
                    </a>

                    <h2>
                        Registrar novo gasto
                    </h2>

                    <p>
                        Informe os dados da despesa.
                    </p>

                </div>

            </div>



            <!-- =================================================
                 FORMULÁRIO
                 ================================================= -->

            <div class="form-container">


                <form id="formulario">


                    <!-- =========================================
                         DESCRIÇÃO
                         ========================================= -->

                    <div class="form-group">

                        <label for="descricao">
                            Descrição
                        </label>

                        <input
                            type="text"
                            id="descricao"
                            name="descricao"
                            placeholder="Ex.: Supermercado, combustível..."
                        >

                    </div>



                    <!-- =========================================
                         CATEGORIA
                         ========================================= -->

                    <div class="form-group">

                        <label for="categoria">
                            Categoria
                        </label>

                        <select
                            id="categoria"
                            name="categoria"
                        >

                            <option value="">
                                Selecione uma categoria
                            </option>

                            <option value="alimentacao">
                                Alimentação
                            </option>

                            <option value="mercado">
                                Mercado
                            </option>

                            <option value="transporte">
                                Transporte
                            </option>

                            <option value="casa">
                                Casa
                            </option>

                            <option value="saude">
                                Saúde
                            </option>

                            <option value="educacao">
                                Educação
                            </option>

                            <option value="lazer">
                                Lazer
                            </option>

                            <option value="contas">
                                Contas
                            </option>

                            <option value="outros">
                                Outros
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         VALOR E DATA
                         ========================================= -->

                    <div class="form-row">


                        <div class="form-group">

                            <label for="valor">
                                Valor
                            </label>

                            <div class="input-money">

                                <span>
                                    R$
                                </span>

                                <input
                                    type="text"
                                    id="valor"
                                    name="valor"
                                    placeholder="0,00"
                                >

                            </div>

                        </div>



                        <div class="form-group">

                            <label for="data">
                                Data
                            </label>

                            <input
                                type="date"
                                id="data"
                                name="data"
                            >

                        </div>


                    </div>



                    <!-- =========================================
                         MODO DA OPERAÇÃO
                         ========================================= -->

                    <div class="form-group">

                        <label for="modo">
                            Modo da operação
                        </label>

                        <select
                            id="modo"
                            name="modo"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="pix">
                                PIX
                            </option>

                            <option value="debito">
                                Débito
                            </option>

                            <option value="credito">
                                Crédito
                            </option>

                            <option value="dinheiro">
                                Dinheiro
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         ORIGEM DO DINHEIRO
                         ========================================= -->

                    <div class="form-group">

                        <label for="origem">
                            Origem do dinheiro
                        </label>

                        <select
                            id="origem"
                            name="origem"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="nubank">
                                Nubank
                            </option>

                            <option value="mercado-pago">
                                Mercado Pago
                            </option>

                            <option value="caixa">
                                Caixa
                            </option>

                            <option value="dinheiro">
                                Dinheiro em espécie
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         CARTÃO
                         FICARÁ OCULTO INICIALMENTE
                         ========================================= -->

                    <div
                        class="form-group"
                        id="grupoCartao"
                        style="display: none;"
                    >

                        <label for="cartao">
                            Cartão
                        </label>

                        <select
                            id="cartao"
                            name="cartao"
                        >

                            <option value="">
                                Selecione o cartão
                            </option>

                            <option value="nubank-1234">
                                Nubank • final 1234
                            </option>

                            <option value="mercado-pago-5678">
                                Mercado Pago • final 5678
                            </option>

                            <option value="caixa-9012">
                                Caixa • final 9012
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         OBSERVAÇÃO
                         ========================================= -->

                    <div class="form-group">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            placeholder="Alguma informação adicional..."
                            rows="4"
                        ></textarea>

                    </div>



                    <!-- =========================================
                         BOTÕES
                         ========================================= -->

                    <div class="form-actions">


                        <a
                            href="index.html"
                            class="cancel-button"
                        >
                            Cancelar
                        </a>


                        <button
                            type="submit"
                            class="save-button"
                        >
                            ✓ Salvar gasto
                        </button>


                    </div>


                </form>


            </div>


        </section>


    </main>


    <!-- JavaScript específico desta tela -->

    <script src="js/nova-saida.js"></script>

</body>

</html>
